services:
  arcadedb:
    image: arcadedata/arcadedb:26.11.1
    # The oldest release the driver supports (26.10.x lacks Cypher fulltext/vector index DDL).
    # A release tag is immutable, so CI and local runs see the same server.
    container_name: arcadedb-graphiti
    ports:
      - "2481:2480" # HTTP / Studio
      - "7687:7687" # Bolt
    environment:
      JAVA_OPTS: >-
        -Darcadedb.server.rootPassword=playwithdata
        -Darcadedb.server.plugins=Bolt:com.arcadedb.bolt.BoltProtocolPlugin
        -Darcadedb.server.defaultDatabases=graphiti[root]
        -Darcadedb.maxPageRAM=512
        -XX:MaxDirectMemorySize=1g
      # The image's start script appends its own -XX:MaxRAMPercentage=75 after JAVA_OPTS, so a
      # percentage set there is overridden; ARCADEDB_OPTS_MEMORY is the supported way to size
      # the heap. 2.5 GB heap + 1 GB direct + page cache fit the 5 GB limit below.
      ARCADEDB_OPTS_MEMORY: -Xms512m -Xmx2560m
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 5g
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- --header='Authorization:Basic cm9vdDpwbGF5d2l0aGRhdGE=' http://localhost:2480/api/v1/ready >/dev/null || exit 1
      interval: 5s
      retries: 30
